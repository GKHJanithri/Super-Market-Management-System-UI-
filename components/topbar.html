<header class="topbar">

  <div class="topbar-greeting">
    <h1 class="greeting-title" id="page-title">Good Morning Admin</h1>
    <p class="greeting-sub" id="page-sub">
      Here's what's happening with your store today.
    </p>
  </div>

  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Search anything...">
  </div>

  <div class="topbar-actions">
    <button class="icon-btn" title="Notifications">
      <i class="fa-regular fa-bell"></i>
    </button>
    <button class="icon-btn" title="Apps">
      <i class="fa-solid fa-grip"></i>
    </button>
    <button class="icon-btn" type="button" title="Settings" aria-label="Open settings" onclick="window.location.href='settings.html'">
      <i class="fa-solid fa-sun"></i>
    </button>
  </div>

</header>
